name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests and enforce coverage
        run: >-
          python -m pytest
          --cov=target
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Add the RENDER_DEPLOY_HOOK_URL GitHub Actions secret."
            exit 1
          fi
          response_code=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}")
          case "$response_code" in
            200|202) echo "Render accepted deploy request for ${COMMIT_SHA}." ;;
            *) echo "::error::Render deploy hook returned HTTP ${response_code}."; exit 1 ;;
          esac

  smoke-test:
    name: Smoke test live deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Wait for the commit to become healthy
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::error::Add the public service URL as the LIVE_URL repository variable."
            exit 1
          fi
          LIVE_URL="${LIVE_URL%/}"
          for attempt in $(seq 1 60); do
            health_response=$(curl --silent --show-error --max-time 20 \
              "${LIVE_URL}/health" || true)
            live_sha=$(printf '%s' "$health_response" | jq -r '.sha // empty')
            if [ "$live_sha" = "$COMMIT_SHA" ]; then
              echo "Live service reports expected commit ${COMMIT_SHA}."
              exit 0
            fi
            echo "Waiting for ${COMMIT_SHA} (${attempt}/60)."
            sleep 10
          done
          echo "::error::Live service did not report ${COMMIT_SHA} within 10 minutes."
          exit 1

      - name: Check live homepage and health endpoint
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          LIVE_URL="${LIVE_URL%/}"
          homepage=$(curl --fail --silent --show-error "${LIVE_URL}/")
          printf '%s' "$homepage" | grep -q "Function Lab"
          health_response=$(curl --fail --silent --show-error "${LIVE_URL}/health")
          printf '%s' "$health_response" | jq -e --arg sha "$COMMIT_SHA" '.sha == $sha'

      - name: Check live function runner
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          LIVE_URL="${LIVE_URL%/}"
          response=$(curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"function":"divide","arguments":[8,2]}' \
            "${LIVE_URL}/run")
          printf '%s' "$response" | jq -e '.result == 4 and .result_type == "float"'
